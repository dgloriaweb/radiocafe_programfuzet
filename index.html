<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiocafé Műsorprogram</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        /* Dark-mode guidance: avoid pure black; use near-black + surface steps */
        background: #111315;
        color: #e6e6e6;
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 200px;
        background: linear-gradient(
          to bottom,
          #111315 0%,
          #111315 55%,
          transparent 100%
        );
        pointer-events: none;
        z-index: 99;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        background: rgba(17, 19, 21, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        margin-bottom: 30px;
        text-align: center;
        border: 2px solid #ff6b35;
        position: sticky;
        top: 20px;
        z-index: 100;
      }

      h1 {
        color: #ff6b35;
        font-size: 2rem;
        margin-bottom: 20px;
      }

      .day-selector {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .day-btn {
        background: #161a1d;
        color: #c9c9c9;
        border: 2px solid rgba(255, 255, 255, 0.1);
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .day-btn:hover {
        background: #ff6b35;
        color: #000;
        border-color: #ff6b35;
      }

      .day-btn.active {
        background: #ff6b35;
        color: #000;
        border-color: #ff6b35;
      }

      .days-container {
        display: grid;
        gap: 20px;
      }

      .day-section {
        background: #131518;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.08);
        scroll-margin-top: 200px;
      }

      .day-title {
        font-size: 1.5rem;
        color: #ff6b35;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 3px solid #ff6b35;
      }

      .show-card {
        background: #171a1e;
        border-left: 4px solid #ff6b35;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .show-card:hover {
        transform: translateX(5px);
        box-shadow: 0 3px 10px rgba(255, 107, 53, 0.3);
        background: #1b1f24;
      }

      .show-details {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }

      .show-card.expanded .show-details {
        max-height: 500px;
        margin-top: 12px;
      }

      .details-toggle {
        color: #ff6b35;
        font-size: 0.9rem;
        margin-top: 8px;
        display: inline-block;
      }

      .show-time {
        font-weight: bold;
        color: #ff6b35;
        font-size: 1.1rem;
        margin-bottom: 8px;
      }

      .show-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 8px;
      }

      .show-presenters {
        color: #b0b0b0;
        font-size: 0.9rem;
        margin-bottom: 8px;
      }

      .show-description {
        color: #c3c3c3;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 0.75rem;
        margin-left: 8px;
        font-weight: 600;
      }

      .badge-live {
        background: #ff6b35;
        color: #000;
      }

      .badge-podcast {
        background: #ff6b35;
        color: #000;
      }

      .badge-offline {
        background: #666;
        color: #fff;
      }

      .now-playing {
        position: fixed;
        bottom: 20px;
        right: 20px;
        /* Light-mode inverse card */
        background: #ffd6c7;
        backdrop-filter: blur(10px);
        border: 2px solid #ff6b35;
        border-radius: 15px;
        padding: 20px;
        width: 360px;
        max-width: 40vw;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        z-index: 1000;
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
      }

      .now-playing.hidden {
        transform: translateY(20px);
        opacity: 0;
        pointer-events: none;
      }

      .now-playing-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .now-playing-title {
        color: #ff6b35;
        font-size: 1rem;
        font-weight: 600;
      }

      .now-playing-close {
        background: none;
        border: none;
        color: #111315;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s ease;
      }

      .now-playing-close:hover {
        color: #ff6b35;
      }

      .now-playing-show {
        color: #111315;
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .now-playing-time {
        color: #ff6b35;
        font-size: 0.9rem;
        margin-bottom: 8px;
      }

      .now-playing-presenters {
        color: #3b3f45;
        font-size: 0.85rem;
      }

      .now-playing-no-show {
        color: #3b3f45;
        font-style: italic;
      }

      @media (max-width: 480px) {
        .now-playing {
          left: 10px;
          right: 10px;
          width: auto;
          max-width: none;
        }
      }

      .no-shows {
        color: #666;
        font-style: italic;
        text-align: center;
        padding: 20px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }

        header {
          padding: 20px;
          top: 15px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .day-selector {
          gap: 6px;
        }

        .day-btn {
          padding: 8px 12px;
          font-size: 0.85rem;
        }

        .day-section {
          padding: 15px;
          scroll-margin-top: 220px;
        }

        .day-title {
          font-size: 1.3rem;
        }

        .show-title {
          font-size: 1.1rem;
        }

        .show-time {
          font-size: 1rem;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 10px;
        }

        header {
          padding: 15px;
          top: 10px;
        }

        h1 {
          font-size: 1.3rem;
        }

        .day-btn {
          padding: 6px 10px;
          font-size: 0.8rem;
        }

        .show-card {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Radiocafé Műsorprogram</h1>

        <div class="day-selector">
          <button class="day-btn" data-day="Monday">H</button>
          <button class="day-btn" data-day="Tuesday">K</button>
          <button class="day-btn" data-day="Wednesday">Sze</button>
          <button class="day-btn" data-day="Thursday">Cs</button>
          <button class="day-btn" data-day="Friday">P</button>
          <button class="day-btn" data-day="Saturday">Szo</button>
          <button class="day-btn" data-day="Sunday">V</button>
        </div>
      </header>

      <div class="days-container" id="schedule"></div>
    </div>

    <div class="now-playing" id="nowPlaying">
      <div class="now-playing-header">
        <div class="now-playing-title">Most szól...</div>
        <button class="now-playing-close" id="closeNowPlaying">&times;</button>
      </div>
      <div id="nowPlayingContent"></div>
    </div>

    <script>
      const days = [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday",
      ];
      const dayNames = {
        Monday: "Hétfő",
        Tuesday: "Kedd",
        Wednesday: "Szerda",
        Thursday: "Csütörtök",
        Friday: "Péntek",
        Saturday: "Szombat",
        Sunday: "Vasárnap",
      };

      function isInOfflinePeriod(offlinePeriods) {
        if (!offlinePeriods || offlinePeriods.length === 0) return null;

        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth() + 1;
        const currentDay = now.getDate();

        for (const period of offlinePeriods) {
          const [fromMonth, fromDay] = period.from.split("-").map(Number);
          const [toMonth, toDay] = period.to.split("-").map(Number);

          const fromDate = new Date(currentYear, fromMonth - 1, fromDay);
          const toDate = new Date(currentYear, toMonth - 1, toDay);
          const currentDate = new Date(
            currentYear,
            currentMonth - 1,
            currentDay,
          );

          if (currentDate >= fromDate && currentDate <= toDate) {
            return {
              reason: period.reason,
              endDate: `${currentYear}-${String(toMonth).padStart(2, "0")}-${String(toDay).padStart(2, "0")}`,
            };
          }
        }

        return null;
      }

      async function loadSchedule() {
        try {
          const response = await fetch("radiocafe_shows.json");
          const shows = await response.json();

          const scheduleContainer = document.getElementById("schedule");

          days.forEach((day) => {
            const daySection = document.createElement("div");
            daySection.className = "day-section";
            daySection.id = `day-${day}`;

            const dayTitle = document.createElement("h2");
            dayTitle.className = "day-title";
            dayTitle.textContent = dayNames[day];
            daySection.appendChild(dayTitle);

            const dayShows = [];

            shows.forEach((show) => {
              show.broadcasts.forEach((broadcast) => {
                if (broadcast.day === day && broadcast.is_main_air_time) {
                  dayShows.push({
                    ...show,
                    time: broadcast.start_time,
                    endTime: broadcast.end_time,
                    isLive: broadcast.expected_live,
                  });
                }
              });
            });

            dayShows.sort((a, b) => {
              const timeA = a.time.split(":").map(Number);
              const timeB = b.time.split(":").map(Number);
              return timeA[0] * 60 + timeA[1] - (timeB[0] * 60 + timeB[1]);
            });

            if (dayShows.length === 0) {
              const noShows = document.createElement("div");
              noShows.className = "no-shows";
              noShows.textContent = "Nincs műsor ezen a napon";
              daySection.appendChild(noShows);
            } else {
              dayShows.forEach((show) => {
                const showCard = document.createElement("div");
                showCard.className = "show-card";

                const timeStr = show.endTime
                  ? `${show.time} - ${show.endTime}`
                  : show.time;

                const offlineInfo = isInOfflinePeriod(show.offline_periods);

                let badges = "";
                if (offlineInfo) {
                  badges += `<span class="badge badge-offline">${offlineInfo.reason} - ${offlineInfo.endDate}-ig</span>`;
                } else {
                  if (show.isLive) {
                    badges += '<span class="badge badge-live">ÉLŐ</span>';
                  }
                }
                if (show.is_podcast) {
                  badges += '<span class="badge badge-podcast">PODCAST</span>';
                }

                const presenters =
                  show.presenters && show.presenters.length > 0
                    ? `<div class="show-presenters">Műsorvezetők: ${show.presenters.join(", ")}</div>`
                    : "";

                showCard.innerHTML = `
                                <div class="show-time">${timeStr}${badges}</div>
                                <div class="show-title">${show.show}</div>
                                <div class="details-toggle">Részletek...</div>
                                <div class="show-details">
                                    ${presenters}
                                    <div class="show-description">${show.description_hu}</div>
                                </div>
                            `;

                showCard.addEventListener("click", () => {
                  showCard.classList.toggle("expanded");
                });

                daySection.appendChild(showCard);
              });
            }

            scheduleContainer.appendChild(daySection);
          });

          setupDayButtons();
        } catch (error) {
          console.error("Hiba a műsorprogram betöltésekor:", error);
          document.getElementById("schedule").innerHTML =
            '<div class="day-section"><p class="no-shows">Hiba történt a műsorprogram betöltésekor.</p></div>';
        }
      }

      function setupDayButtons() {
        const dayButtons = document.querySelectorAll(".day-btn");
        let isUserScrolling = true;

        dayButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const targetDay = button.getAttribute("data-day");
            const targetSection = document.getElementById(`day-${targetDay}`);

            if (targetSection) {
              dayButtons.forEach((btn) => btn.classList.remove("active"));
              button.classList.add("active");

              isUserScrolling = false;
              targetSection.scrollIntoView({
                behavior: "smooth",
                block: "start",
              });

              setTimeout(() => {
                isUserScrolling = true;
              }, 1000);
            }
          });
        });

        function updateActiveButton() {
          if (!isUserScrolling) return;

          const sections = document.querySelectorAll(".day-section");
          const scrollPosition = window.scrollY + window.innerHeight / 2;

          let closestSection = null;
          let closestDistance = Infinity;

          sections.forEach((section) => {
            const sectionTop = section.offsetTop;
            const sectionMiddle = sectionTop + section.offsetHeight / 2;
            const distance = Math.abs(scrollPosition - sectionMiddle);

            if (distance < closestDistance) {
              closestDistance = distance;
              closestSection = section;
            }
          });

          if (closestSection) {
            const day = closestSection.id.replace("day-", "");
            dayButtons.forEach((btn) => {
              if (btn.getAttribute("data-day") === day) {
                dayButtons.forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
              }
            });
          }
        }

        let scrollTimeout;
        window.addEventListener("scroll", () => {
          clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(updateActiveButton, 50);
        });
        updateActiveButton();
      }

      function updateNowPlaying() {
        const now = new Date();
        const currentDay = days[now.getDay() === 0 ? 6 : now.getDay() - 1];
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        const currentTimeMinutes = currentHour * 60 + currentMinute;

        fetch("radiocafe_shows.json")
          .then((response) => response.json())
          .then((shows) => {
            let currentShow = null;

            for (const show of shows) {
              for (const broadcast of show.broadcasts) {
                if (
                  broadcast.day === currentDay &&
                  broadcast.is_main_air_time
                ) {
                  const [startHour, startMin] = broadcast.start_time
                    .split(":")
                    .map(Number);
                  const startTimeMinutes = startHour * 60 + startMin;

                  let endTimeMinutes;
                  if (broadcast.end_time) {
                    const [endHour, endMin] = broadcast.end_time
                      .split(":")
                      .map(Number);
                    endTimeMinutes = endHour * 60 + endMin;
                  } else {
                    endTimeMinutes = startTimeMinutes + 60;
                  }

                  if (
                    currentTimeMinutes >= startTimeMinutes &&
                    currentTimeMinutes < endTimeMinutes
                  ) {
                    const offlineInfo = isInOfflinePeriod(show.offline_periods);
                    if (!offlineInfo) {
                      currentShow = {
                        ...show,
                        time: broadcast.start_time,
                        endTime: broadcast.end_time,
                      };
                      break;
                    }
                  }
                }
              }
              if (currentShow) break;
            }

            const content = document.getElementById("nowPlayingContent");
            if (currentShow) {
              const timeStr = currentShow.endTime
                ? `${currentShow.time} - ${currentShow.endTime}`
                : currentShow.time;

              const presenters =
                currentShow.presenters && currentShow.presenters.length > 0
                  ? `<div class="now-playing-presenters">${currentShow.presenters.join(", ")}</div>`
                  : "";

              content.innerHTML = `
                            <div class="now-playing-show">${currentShow.show}</div>
                            <div class="now-playing-time">${timeStr}</div>
                            ${presenters}
                        `;
            } else {
              content.innerHTML =
                '<div class="now-playing-no-show">Jelenleg nincs élő műsor</div>';
            }
          });
      }

      document
        .getElementById("closeNowPlaying")
        .addEventListener("click", () => {
          document.getElementById("nowPlaying").classList.add("hidden");
        });

      // Always show after refresh; close only hides for current page session.
      updateNowPlaying();
      setInterval(updateNowPlaying, 60000);

      loadSchedule();
    </script>
  </body>
</html>
